<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - 智能旅行规划系统</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4facfe;
            --primary-dark: #00f2fe;
            --text-main: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.7);
            --glass-bg: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
            --input-bg: rgba(255, 255, 255, 0.15);
            --error: #ff6b6b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            position: relative;
            background-image: url("{{ url_for('static', filename='images/register_background.png') }}");
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center center;
            background-attachment: fixed;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Overlay to ensure text readability */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.3);
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 480px;
            /* Slightly wider for register form */
            padding: 20px;
        }

        .register-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 40px 40px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            text-align: center;
            animation: fadeIn 0.8s ease-out;
            max-height: 90vh;
            overflow-y: auto;
            /* Allow scrolling if content is too tall on small screens */
        }

        /* Custom scrollbar for the card */
        .register-card::-webkit-scrollbar {
            width: 6px;
        }

        .register-card::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
        }

        .register-card::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .brand-logo {
            font-size: 42px;
            margin-bottom: 12px;
            display: inline-block;
            filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.2));
        }

        h1 {
            color: var(--text-main);
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 6px;
            letter-spacing: -0.5px;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: 24px;
            font-weight: 400;
        }

        .input-group {
            margin-bottom: 16px;
            text-align: left;
            position: relative;
        }

        .input-group label {
            display: block;
            color: var(--text-secondary);
            font-size: 12px;
            margin-bottom: 6px;
            font-weight: 500;
            margin-left: 4px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper input {
            width: 100%;
            padding: 12px 16px;
            background: var(--input-bg);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            color: var(--text-main);
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .input-wrapper input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .input-wrapper input:focus {
            outline: none;
            background: rgba(255, 255, 255, 0.25);
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(79, 172, 254, 0.2);
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            margin-top: 16px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(79, 172, 254, 0.4);
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(79, 172, 254, 0.5);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .footer-links {
            margin-top: 20px;
            font-size: 14px;
            color: var(--text-secondary);
        }

        .footer-links a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            margin-left: 4px;
            transition: color 0.2s;
        }

        .footer-links a:hover {
            color: #fff;
            text-decoration: underline;
        }

        .alert {
            background: rgba(255, 107, 107, 0.2);
            border: 1px solid rgba(255, 107, 107, 0.4);
            color: #ffcccc;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="register-card">
            <div class="brand-logo">🧭</div>
            <h1>创建账户</h1>
            <p class="subtitle">开启您的智能旅行规划之旅</p>

            {% if error %}
            <div class="alert">
                ⚠️ {{ error }}
            </div>
            {% endif %}

            <form method="POST" action="{{ url_for('register') }}">
                <div class="input-group">
                    <label>用户名 *</label>
                    <div class="input-wrapper">
                        <input type="text" name="username" placeholder="请输入用户名" required>
                    </div>
                </div>

                <div class="input-group">
                    <label>密码 *</label>
                    <div class="input-wrapper">
                        <input type="password" name="password" placeholder="请输入密码" required>
                    </div>
                </div>

                <div class="input-group">
                    <label>电话 (可选)</label>
                    <div class="input-wrapper">
                        <input type="text" name="phone" placeholder="用于行程联系">
                    </div>
                </div>

                <div class="input-group">
                    <label>邮箱 (可选)</label>
                    <div class="input-wrapper">
                        <input type="email" name="email" placeholder="用于通知与找回">
                    </div>
                </div>

                <button type="submit" class="submit-btn">立即注册</button>
            </form>

            <div class="footer-links">
                已有账号？<a href="{{ url_for('login') }}">立即登录</a>
            </div>
        </div>
    </div>
</body>

</html>
